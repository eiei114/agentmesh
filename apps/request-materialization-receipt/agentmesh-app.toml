schema_version = "agentmesh-app.v0"
name = "request-materialization-receipt"
protocol_version = "2026-07-15"

[plugin]
logical_name = "agentmesh-request-materialization-receipt"

[limits]
# Host raw UTF-8 JSON limit; the receipt plugin separately caps compact JSON at 65,536 bytes.
input_max_bytes = 131072

[schemas]
input = "schemas/request-materialization-receipt-input-v0.schema.json"
output = "schemas/request-materialization-receipt-compact-v0.schema.json"

[sidecar]
retention_class = "owner_local"
capture_plugin_stderr = false

[conformance]
cargo_package = "agentmesh-markdown-request-validator"
